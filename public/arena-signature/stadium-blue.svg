<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!--
    TEYEON OPEN Signature Arena — 낮 경기장 배경 v4 Soft Stadium (장식 전용, 직접 제작한 벡터).
    V4: 원근 구조(소실점 · 코트 치수)는 v3 그대로, 색 · 무늬 · 빛 · 장식의 강도만 낮췄다(Warm Ivory · Soft Slate).
    ⚠ 글자 · 점수 · 로고 · 팀 이름이 없다. 정보는 전부 화면 컴포넌트가 그린다.
    구성 원칙(기준 이미지 재분석):
      · 공기 원근 — 멀수록 하얗고 흐리게(관중석은 밝게 바랜 색), 가까울수록 조금 더 진하게.
      · 낮은 카메라 원근 — 소실점 (960, 790). 코트 · 네트 · 관중석 단이 이 점으로 모인다.
        y = 790 + 4600 / z ,  x = 960 + 511 · X / z   (X · z 단위: ft, 네트 z = 40)
      · 빛 — 위 양쪽 조명에서 가운데로, 그리고 가운데 빛기둥이 트로피 → FINAL → 네트로 이어진다.
      · 정보 자리(양쪽 대진 레인 · 코트 카드)는 화면 컴포넌트의 반투명 판과 보호막이 한 번 더 덮는다.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFEFB"/>
      <stop offset="0.14" stop-color="#FAF7F1"/>
      <stop offset="0.45" stop-color="#F1EDE6"/>
      <stop offset="0.78" stop-color="#EAE7E1"/>
      <stop offset="1" stop-color="#E3E2DF"/>
    </linearGradient>

    <!-- 관중석: 공기 원근(바깥 · 가까이 = 조금 진함 → 가운데 · 멀리 = 하얗게). -->
    <linearGradient id="standL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C3C9D4"/>
      <stop offset="0.55" stop-color="#D9DDE4"/>
      <stop offset="1" stop-color="#ECEBE7"/>
    </linearGradient>
    <linearGradient id="standR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#C3C9D4"/>
      <stop offset="0.55" stop-color="#D9DDE4"/>
      <stop offset="1" stop-color="#ECEBE7"/>
    </linearGradient>
    <linearGradient id="standLowL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B2BAC8"/>
      <stop offset="0.6" stop-color="#CDD3DC"/>
      <stop offset="1" stop-color="#E5E5E2"/>
    </linearGradient>
    <linearGradient id="standLowR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#B2BAC8"/>
      <stop offset="0.6" stop-color="#CDD3DC"/>
      <stop offset="1" stop-color="#E5E5E2"/>
    </linearGradient>
    <linearGradient id="backStand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F1EC"/>
      <stop offset="1" stop-color="#DCDDDC"/>
    </linearGradient>

    <!-- 관중(가까이: 크고 흐림 / 멀리: 작고 옅음). 밝게 바랜 파스텔 — 무늬가 튀지 않게. -->
    <pattern id="crowdNearL" width="22" height="17" patternUnits="userSpaceOnUse" patternTransform="skewY(-12)">
      <circle cx="4" cy="5" r="3.4" fill="#FFFFFF" fill-opacity="0.45"/>
      <circle cx="14" cy="4" r="3.2" fill="#E6C7A2" fill-opacity="0.35"/>
      <circle cx="9" cy="12.5" r="3.3" fill="#8792A8" fill-opacity="0.2"/>
      <circle cx="19" cy="12" r="3.1" fill="#EADFC0" fill-opacity="0.3"/>
    </pattern>
    <pattern id="crowdNearR" width="22" height="17" patternUnits="userSpaceOnUse" patternTransform="skewY(12)">
      <circle cx="4" cy="5" r="3.4" fill="#FFFFFF" fill-opacity="0.45"/>
      <circle cx="14" cy="4" r="3.2" fill="#E6C7A2" fill-opacity="0.35"/>
      <circle cx="9" cy="12.5" r="3.3" fill="#8792A8" fill-opacity="0.2"/>
      <circle cx="19" cy="12" r="3.1" fill="#EADFC0" fill-opacity="0.3"/>
    </pattern>
    <pattern id="crowdMidL" width="14" height="11" patternUnits="userSpaceOnUse" patternTransform="skewY(-14)">
      <circle cx="3" cy="3" r="2.2" fill="#FFFFFF" fill-opacity="0.6"/>
      <circle cx="10" cy="3.5" r="2.1" fill="#E8CCAA" fill-opacity="0.45"/>
      <circle cx="6.5" cy="8.5" r="2.1" fill="#8792A8" fill-opacity="0.18"/>
    </pattern>
    <pattern id="crowdMidR" width="14" height="11" patternUnits="userSpaceOnUse" patternTransform="skewY(14)">
      <circle cx="3" cy="3" r="2.2" fill="#FFFFFF" fill-opacity="0.6"/>
      <circle cx="10" cy="3.5" r="2.1" fill="#E8CCAA" fill-opacity="0.45"/>
      <circle cx="6.5" cy="8.5" r="2.1" fill="#8792A8" fill-opacity="0.18"/>
    </pattern>
    <pattern id="crowdFar" width="8" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.45"/>
      <circle cx="6" cy="4.5" r="1.1" fill="#D9C3A5" fill-opacity="0.3"/>
    </pattern>
    <pattern id="mesh" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 0 L5 5 M5 0 L0 5" stroke="#3A4560" stroke-opacity="0.38" stroke-width="0.6"/>
    </pattern>

    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="column" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="courtShine" cx="0.5" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8E6E1"/>
      <stop offset="1" stop-color="#D8D9D8"/>
    </linearGradient>
    <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4E9EF"/>
      <stop offset="0.35" stop-color="#D6DEE8"/>
      <stop offset="1" stop-color="#C8D2DF"/>
    </linearGradient>
    <linearGradient id="truss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#E7E5DF" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="ledBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E99AE"/>
      <stop offset="0.5" stop-color="#A3ADBF"/>
      <stop offset="1" stop-color="#8E99AE"/>
    </linearGradient>

    <filter id="blurNear" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="blurMid" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="0.9"/></filter>
    <filter id="blurSoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="blurTree" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>

    <symbol id="leaf" viewBox="-50 -50 100 100">
      <path d="M0 -46 L9 -24 L24 -32 L19 -10 L40 -14 L28 4 L36 12 L12 14 L14 34 L2 22 L0 46 L-2 22 L-14 34 L-12 14 L-36 12 L-28 4 L-40 -14 L-19 -10 L-24 -32 L-9 -24 Z" fill="currentColor"/>
      <path d="M0 -30 L0 44" stroke="#8A3B0F" stroke-opacity="0.45" stroke-width="2"/>
    </symbol>
    <!-- 단풍 나무 덩어리(흐림 — 원경 장식) -->
    <symbol id="foliage" viewBox="0 0 200 200">
      <circle cx="60" cy="90" r="52" fill="#F08A2C"/>
      <circle cx="120" cy="70" r="48" fill="#F6A33F"/>
      <circle cx="150" cy="125" r="46" fill="#E46A1E"/>
      <circle cx="80" cy="140" r="44" fill="#F59A35"/>
      <circle cx="110" cy="110" r="38" fill="#FFC062"/>
      <circle cx="40" cy="150" r="30" fill="#D9561A"/>
    </symbol>
  </defs>

  <!-- ① 하늘 · 지붕 안쪽 -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- ② 맞은편 관중석(가장 멀리 — 가장 하얗다) -->
  <path d="M600 330 L1320 330 L1320 836 L600 836 Z" fill="url(#backStand)"/>
  <path d="M600 330 L1320 330 L1320 836 L600 836 Z" fill="url(#crowdFar)" filter="url(#blurMid)" opacity="1"/>
  <g stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2">
    <path d="M600 430 H1320 M600 520 H1320 M600 600 H1320 M600 670 H1320 M600 730 H1320 M600 780 H1320"/>
  </g>
  <!-- 맞은편 광고 띠(LED) -->
  <path d="M600 812 L1320 812 L1320 836 L600 836 Z" fill="url(#ledBand)" opacity="0.45"/>
  <path d="M600 812 L1320 812" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2"/>

  <!-- ③ 왼쪽 관중석 — 위 단 · 통로 · 아래 단(단마다 소실점 쪽으로 모인다) -->
  <path d="M0 120 L640 330 L640 560 L0 540 Z" fill="url(#standL)"/>
  <path d="M0 120 L640 330 L640 560 L0 540 Z" fill="url(#crowdMidL)" filter="url(#blurMid)"/>
  <path d="M0 540 L640 560 L640 586 L0 584 Z" fill="#F4F8FF" opacity="0.5" filter="url(#blurMid)"/>
  <path d="M0 584 L640 586 L640 836 L0 1080 Z" fill="url(#standLowL)"/>
  <path d="M0 584 L640 586 L640 836 L0 1080 Z" fill="url(#crowdNearL)" filter="url(#blurNear)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.2" fill="none">
    <path d="M0 200 L640 372"/><path d="M0 280 L640 414"/><path d="M0 360 L640 456"/><path d="M0 450 L640 504"/>
    <path d="M0 680 L640 634"/><path d="M0 780 L640 684"/><path d="M0 880 L640 734"/><path d="M0 980 L640 786"/>
  </g>
  <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3" fill="none">
    <path d="M150 168 L190 556"/><path d="M330 228 L352 562"/><path d="M500 284 L512 566"/>
    <path d="M150 588 L60 1080"/><path d="M330 586 L282 950"/><path d="M500 586 L478 860"/>
  </g>

  <!-- ③ 오른쪽 관중석(거울) -->
  <path d="M1920 120 L1280 330 L1280 560 L1920 540 Z" fill="url(#standR)"/>
  <path d="M1920 120 L1280 330 L1280 560 L1920 540 Z" fill="url(#crowdMidR)" filter="url(#blurMid)"/>
  <path d="M1920 540 L1280 560 L1280 586 L1920 584 Z" fill="#F4F8FF" opacity="0.5" filter="url(#blurMid)"/>
  <path d="M1920 584 L1280 586 L1280 836 L1920 1080 Z" fill="url(#standLowR)"/>
  <path d="M1920 584 L1280 586 L1280 836 L1920 1080 Z" fill="url(#crowdNearR)" filter="url(#blurNear)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.2" fill="none">
    <path d="M1920 200 L1280 372"/><path d="M1920 280 L1280 414"/><path d="M1920 360 L1280 456"/><path d="M1920 450 L1280 504"/>
    <path d="M1920 680 L1280 634"/><path d="M1920 780 L1280 684"/><path d="M1920 880 L1280 734"/><path d="M1920 980 L1280 786"/>
  </g>
  <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3" fill="none">
    <path d="M1770 168 L1730 556"/><path d="M1590 228 L1568 562"/><path d="M1420 284 L1408 566"/>
    <path d="M1770 588 L1860 1080"/><path d="M1590 586 L1638 950"/><path d="M1420 586 L1442 860"/>
  </g>

  <!-- 관중석 이음매 부드럽게 — 맞은편 · 양옆 관중석이 만나는 세로 경계와 위 경계를 빛으로 녹인다 -->
  <g filter="url(#blurSoft)" fill="#FFFFFF">
    <rect x="596" y="300" width="88" height="560" opacity="0.55"/>
    <rect x="1236" y="300" width="88" height="560" opacity="0.55"/>
    <rect x="560" y="290" width="800" height="70" opacity="0.6"/>
  </g>

  <!-- ④ 지붕 철골 — 양쪽 위에서 가운데로 모이는 트러스 + 가운데 아치 -->
  <g opacity="0.6">
    <path d="M-40 230 L700 420 L700 446 L-40 268 Z" fill="url(#truss)"/>
    <path d="M1960 230 L1220 420 L1220 446 L1960 268 Z" fill="url(#truss)"/>
    <g stroke="#AEB5C2" stroke-opacity="0.9" stroke-width="2.2" fill="none">
      <path d="M0 240 L40 268 L80 251 L120 279 L160 261 L200 289 L240 272 L280 299 L320 282 L360 309 L400 292 L440 319 L480 302 L520 329 L560 312 L600 339 L640 322 L680 350 L700 342"/>
      <path d="M1920 240 L1880 268 L1840 251 L1800 279 L1760 261 L1720 289 L1680 272 L1640 299 L1600 282 L1560 309 L1520 292 L1480 319 L1440 302 L1400 329 L1360 312 L1320 339 L1280 322 L1240 350 L1220 342"/>
    </g>
    <path d="M560 470 Q 960 300 1360 470" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-opacity="0.85"/>
    <path d="M560 462 Q 960 292 1360 462" fill="none" stroke="#AEB5C2" stroke-width="2" stroke-opacity="0.85"/>
    <path d="M560 478 Q 960 308 1360 478" fill="none" stroke="#AEB5C2" stroke-width="2" stroke-opacity="0.85"/>
    <path d="M560 470 Q 960 300 1360 470" fill="none" stroke="#AEB5C2" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="3 13"/>
    <path d="M590 500 Q 960 340 1330 500" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.6"/>
  </g>

  <!-- ⑤ 조명 빛줄기 — 위 양쪽에서 경기장 가운데로 -->
  <g opacity="0.4">
    <path d="M180 -40 L330 -40 L930 860 L760 880 Z" fill="url(#beam)" opacity="0.55"/>
    <path d="M1740 -40 L1590 -40 L990 860 L1160 880 Z" fill="url(#beam)" opacity="0.55"/>
    <path d="M520 -40 L620 -40 L940 840 L840 850 Z" fill="url(#beam)" opacity="0.5"/>
    <path d="M1400 -40 L1300 -40 L980 840 L1080 850 Z" fill="url(#beam)" opacity="0.5"/>
  </g>

  <!-- ⑥ 바닥(경기장 안쪽) — 소실점으로 모이는 사다리꼴 -->
  <path d="M600 836 L1320 836 L2100 1080 L-180 1080 Z" fill="url(#floor)"/>

  <!-- ⑦ 테니스 코트(원근 계산값) — 먼 쪽 baseline y848 · 네트 y905 · 가까운 service line y1032 -->
  <path d="M844 848 L1076 848 L1539 1080 L381 1080 Z" fill="url(#court)"/>
  <path d="M844 848 L1076 848 L1539 1080 L381 1080 Z" fill="url(#courtShine)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.95" fill="none" stroke-linejoin="round">
    <path d="M844 848 L1076 848" stroke-width="2"/>
    <path d="M844 848 L381 1080 M1076 848 L1539 1080" stroke-width="4"/>
    <path d="M873 848 L526 1080 M1047 848 L1394 1080" stroke-width="3.5"/>
    <path d="M847 865 L1073 865" stroke-width="2"/>
    <path d="M960 865 L960 1032" stroke-width="3"/>
    <path d="M597 1032 L1323 1032" stroke-width="4"/>
  </g>

  <!-- ⑧ 빛기둥 — 위에서 트로피 · FINAL 을 지나 네트까지(가운데 무대) -->
  <path d="M900 0 L1020 0 L1080 905 L840 905 Z" fill="url(#column)" opacity="0.3"/>
  <ellipse cx="960" cy="640" rx="260" ry="240" fill="url(#glow)" opacity="0.45"/>
  <ellipse cx="960" cy="900" rx="280" ry="40" fill="url(#glow)" opacity="0.55"/>

  <!-- ⑨ 네트 — 기둥 X=±21ft(x 692 · 1228), 높이 기둥 45px · 가운데 38px -->
  <ellipse cx="960" cy="910" rx="280" ry="7" fill="#3A4560" opacity="0.1"/>
  <path d="M692 860 Q 960 870 1228 860 L1228 905 L692 905 Z" fill="url(#mesh)"/>
  <path d="M692 860 Q 960 870 1228 860 L1228 905 L692 905 Z" fill="#3A4560" opacity="0.06"/>
  <path d="M692 860 Q 960 870 1228 860" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  <path d="M960 866 L960 905" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.9"/>
  <rect x="688" y="855" width="7" height="52" fill="#56627A"/>
  <rect x="1225" y="855" width="7" height="52" fill="#56627A"/>

  <!-- ⑩ 가을 — 양쪽 끝 · 아래 모서리의 흐린 단풍 덩어리(정보 레인 뒤에서 조금만 비친다) -->
  <g filter="url(#blurTree)" opacity="0.38">
    <use href="#foliage" xlink:href="#foliage" x="-70" y="380" width="150" height="150"/>
    <use href="#foliage" xlink:href="#foliage" x="-80" y="640" width="190" height="190"/>
    <use href="#foliage" xlink:href="#foliage" x="-60" y="900" width="200" height="200"/>
    <use href="#foliage" xlink:href="#foliage" x="1850" y="420" width="150" height="150"/>
    <use href="#foliage" xlink:href="#foliage" x="1820" y="700" width="190" height="190"/>
    <use href="#foliage" xlink:href="#foliage" x="1800" y="930" width="200" height="200"/>
    <use href="#foliage" xlink:href="#foliage" x="300" y="1000" width="150" height="150" opacity="0.85"/>
    <use href="#foliage" xlink:href="#foliage" x="1470" y="1000" width="150" height="150" opacity="0.85"/>
  </g>
  <g color="#D98A4A" opacity="0.55">
    <use href="#leaf" xlink:href="#leaf" x="1888" y="-2" width="34" height="34" transform="rotate(18 1905 15)"/>
    <use href="#leaf" xlink:href="#leaf" x="640" y="1038" width="20" height="20" transform="rotate(28 650 1048)"/>
    <use href="#leaf" xlink:href="#leaf" x="1264" y="1014" width="18" height="18" transform="rotate(-16 1273 1023)"/>
  </g>

  <!-- ⑪ 공기 원근 마무리 — 가운데 위쪽을 조금 더 밝게(시선을 가운데로) -->
  <ellipse cx="960" cy="420" rx="560" ry="230" fill="url(#glow)" opacity="0.18" filter="url(#blurSoft)"/>
</svg>
